
# Nom du microservice
spring.application.name=api-gateway

# Port de l'API Gateway
server.port=8080

# Connexion au serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Route dynamique vers Analytics Service MS6
spring.cloud.gateway.server.webflux.routes[0].id=analytics-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/analytics/**

# Supprimer le prefixe /analytics avant transmission
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Logs pour observer le routage
logging.level.org.springframework.cloud.gateway=DEBUG
# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Informations de l'API Gateway
info.app.name=API Gateway
info.app.description=Point d'entree unique des microservices AGCP
info.app.version=1.0.0