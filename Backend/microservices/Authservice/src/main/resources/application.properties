spring.application.name=Authservice
server.port=8081

# Database Configuration (H2 auth_db)
spring.datasource.url=jdbc:h2:mem:auth_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disabled Eureka as per your previous config
eureka.client.enabled=false

# RabbitMQ Configuration (For UserRegistered / UserDeleted events)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT Configuration
jwt.secret=VotreCleSecreteSuperLongueEtSecuriseePourLeProjetAGCP2025
jwt.expiration=3600000
