spring.application.name=servicegamification
server.port=8085

logging.level.root=INFO
logging.level.com.agcp=DEBUG

# Base MySQL gamification_db (le service demarre meme si MySQL n'est pas lance)
spring.datasource.url=jdbc:mysql://localhost:3306/gamification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.initialization-fail-timeout=-1
# 'none' tant qu'il n'y a pas d'entites ; passer a 'update' quand elles seront ajoutees
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

eureka.client.enabled=false
